<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block t %}FoodConnect - Smart Food Ordering & Meal Planning{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/csv.js') }}"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="nav-brand" href="/">
        <span class="brand-icon">🍽️</span> FoodConnect
      </a>
      <div class="nav-links">
        <a href="/" class="nav-item">Restaurants</a>
        <a href="/planner" class="nav-item">📅 Meal Planner</a>
        <a href="/group-deals" class="nav-item">⚡ Group Deals</a>
        <a href="/charity" class="nav-item">🤝 Surplus Food</a>
        <a href="/orders" class="nav-item">📋 My Orders</a>
      </div>
      <div class="nav-right" style="display:flex; align-items:center; gap:12px;">
        <!-- Notification Bell Dropdown -->
        <div class="notif-wrapper">
          <button class="notif-bell-btn" onclick="toggleNotifDropdown()" id="notif_btn" title="View Notifications">
            🔔 <span id="notif_badge" class="notif-badge" style="display:none">0</span>
          </button>

          <div id="notif_dropdown" class="notif-dropdown" style="display:none">
            <div class="notif-header">
              <b>🔔 Notifications</b>
              <button class="btn btn-xs btn-outline" onclick="markAllNotificationsRead()">Mark all read</button>
            </div>
            <div id="notif_list" class="notif-list">
              <div class="notif-empty">Loading notifications...</div>
            </div>
          </div>
        </div>

        <a href="/wallet" class="wallet-badge" title="Click to view & top-up wallet">
          <span class="wallet-icon">💳</span>
          <span class="wallet-text">Wallet: <b>₹{{ wallet.balance|int if wallet else 1500 }}</b></span>
        </a>
      </div>
    </div>
  </nav>
  <main class="main-content">
    {% block c %}{% endblock %}
  </main>

  <script>
  let notifOpen = false;

  async function loadNotifications() {
    try {
      const resp = await fetch('/api/notifications');
      if (!resp.ok) return;
      const data = await resp.json();
      const badge = document.getElementById('notif_badge');
      const list = document.getElementById('notif_list');

      if (data.unread_count > 0) {
        badge.textContent = data.unread_count;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      if (!data.notifications || data.notifications.length === 0) {
        list.innerHTML = '<div class="notif-empty">No notifications yet</div>';
        return;
      }

      list.innerHTML = data.notifications.map(n => {
        let icon = '📢';
        let extraClass = '';
        if (n.type === 'REFUND') { icon = '💰'; extraClass = 'refund'; }
        else if (n.type === 'WARNING') { icon = '⚠️'; extraClass = 'warning'; }
        else if (n.type === 'SUCCESS') { icon = '✓'; extraClass = 'success'; }

        return `
          <div class="notif-item ${!n.is_read ? 'unread' : ''} ${extraClass}">
            <div class="notif-icon">${icon}</div>
            <div class="notif-content">
              <div class="notif-title">${n.title}</div>
              <div class="notif-msg">${n.message}</div>
              <div class="notif-time">${n.created_at || ''}</div>
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      console.error('Failed to load notifications', e);
    }
  }

  function toggleNotifDropdown() {
    const dd = document.getElementById('notif_dropdown');
    notifOpen = !notifOpen;
    dd.style.display = notifOpen ? 'flex' : 'none';
    if (notifOpen) loadNotifications();
  }

  async function markAllNotificationsRead() {
    await fetch('/api/notifications/clear', { method: 'POST' });
    loadNotifications();
  }

  // Close dropdown on outside click
  document.addEventListener('click', (e) => {
    const wrapper = document.querySelector('.notif-wrapper');
    if (wrapper && !wrapper.contains(e.target) && notifOpen) {
      document.getElementById('notif_dropdown').style.display = 'none';
      notifOpen = false;
    }
  });

  // Auto-load notification count on page load
  document.addEventListener('DOMContentLoaded', loadNotifications);
  </script>
</body>
</html>
